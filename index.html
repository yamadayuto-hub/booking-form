<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>年末年始予定</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<style>
:root{
  --bg:#fbfbfb;--card:#fff;--muted:#8f8f8f;--accent:#111;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);
  font-family:"Noto Sans JP",-apple-system,system-ui;
  display:flex;justify-content:center;
  padding:16px 12px 80px
}
.wrap{width:100%;max-width:780px}

/* header */
.top{position:relative;height:56px}
.title{font-size:26px;font-weight:600;position:absolute;left:50%;transform:translateX(-50%)}
.edit-link{position:absolute;right:0;top:8px;font-size:14px;text-decoration:underline;cursor:pointer}

/* calendar */
.calendar-wrap{margin:12px 0 20px}
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}
.cal-cell{
  background:#fff;border-radius:10px;
  min-height:96px;padding:6px;
  box-shadow:0 1px 3px rgba(0,0,0,.05);
  cursor:pointer;
}
.cal-date{
  font-size:12px;font-weight:700;margin-bottom:6px;
}
.cal-week{
  font-size:11px;color:#888;margin-left:4px;
}
.cal-item{
  font-size:11px;
  background:#111;color:#fff;
  border-radius:6px;padding:2px 6px;
  margin-bottom:4px;
}

/* section */
.section-title{font-size:18px;font-weight:700;margin:24px 0 12px}
.card{background:#fff;border-radius:12px;padding:14px;box-shadow:0 6px 20px rgba(0,0,0,.04)}
.branch{border-bottom:1px solid #eee;padding:10px 0}
.branch:last-child{border-bottom:none}
.branch-date{font-size:14px;color:#555}
.branch-members{font-size:14px;margin:6px 0}
.branch-actions{display:flex;gap:10px}
.branch-actions button{flex:1;padding:8px;border-radius:8px;border:1px solid #ddd;background:#fff}

.notif{
  position:fixed;bottom:20px;left:50%;
  transform:translateX(-50%);
  background:#111;color:#fff;
  padding:10px 14px;border-radius:10px;
  opacity:0
}
</style>
</head>

<body>
<div class="wrap">

  <div class="top">
    <div class="title">年末年始予定</div>
    <div class="edit-link" onclick="location.href='name.html?edit=1'">表示名修正</div>
  </div>

  <!-- カレンダー -->
  <div class="calendar-wrap">
    <div class="calendar" id="calendar"></div>
  </div>

  <div class="section-title">進行中</div>
  <div class="card" id="reserveList">読み込み中...</div>
</div>

<div class="notif" id="notif"></div>

<script>
const SUPABASE_URL = "https://agbfcpaxsrgebxjtkvdh.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_KEY";
const supabase = window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const calendarEl = document.getElementById('calendar');
const reserveList = document.getElementById('reserveList');
const notif = document.getElementById('notif');

const weekJP = ['日','月','火','水','木','金','土'];
let allBranches = [];

function showNotif(msg){
  notif.textContent = msg;
  notif.style.opacity = 1;
  setTimeout(()=>notif.style.opacity=0,2000);
}

function renderCalendar(branches){
  calendarEl.innerHTML = '';

  const start = new Date(2025,11,29);
  const end   = new Date(2026,0,4);

  const map = {};
  branches.forEach(b=>{
    if(!map[b.date]) map[b.date]=[];
    map[b.date].push(b);
  });

  let d = new Date(start);
  while(d <= end){
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const dd = String(d.getDate()).padStart(2,'0');
    const key = `${String(yyyy).slice(2)}/${mm}/${dd}`;

    const cell = document.createElement('div');
    cell.className = 'cal-cell';
    cell.innerHTML = `
      <div class="cal-date">
        ${mm}/${dd}
        <span class="cal-week">(${weekJP[d.getDay()]})</span>
      </div>
    `;

    (map[key]||[]).forEach(b=>{
      cell.innerHTML += `<div class="cal-item">${b.place} / ${b.time}</div>`;
    });

    cell.onclick = ()=> renderBranches(map[key]||[]);
    calendarEl.appendChild(cell);

    d.setDate(d.getDate()+1);
  }
}

function renderBranches(list){
  if(list.length===0){
    reserveList.innerHTML = '予定なし';
    return;
  }
  reserveList.innerHTML = '';
  list.forEach(b=>{
    const el = document.createElement('div');
    el.className = 'branch';
    el.innerHTML = `
      <div class="branch-date">${b.date} / ${b.time} / ${b.place}</div>
      <div class="branch-members">${b.members.join('、')}</div>
      <div class="branch-actions">
        <button onclick="join('${b.id}')">参加</button>
        <button onclick="leave('${b.id}')">取消</button>
      </div>
    `;
    reserveList.appendChild(el);
  });
}

window.join = async(id)=>{
  const name = localStorage.getItem('meeting_app_username');
  const b = allBranches.find(x=>x.id===id);
  if(b.members.includes(name)) return;
  b.members.push(name);
  await supabase.from('branches').update({members:b.members}).eq('id',id);
  showNotif('参加しました');
  bootstrap();
};

window.leave = async(id)=>{
  const name = localStorage.getItem('meeting_app_username');
  const b = allBranches.find(x=>x.id===id);
  b.members = b.members.filter(m=>m!==name);
  if(b.members.length===0){
    await supabase.from('branches').delete().eq('id',id);
  }else{
    await supabase.from('branches').update({members:b.members}).eq('id',id);
  }
  showNotif('取り消しました');
  bootstrap();
};

async function bootstrap(){
  const { data } = await supabase.from('branches').select('*');
  allBranches = data || [];
  renderCalendar(allBranches);
  renderBranches(allBranches);
}
bootstrap();
</script>
</body>
</html>
