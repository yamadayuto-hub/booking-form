<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>参加管理フォーム</title>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    background: #f7f7f7;
    margin: 0;
    padding: 16px;
  }

  h1 {
    font-size: 20px;
    margin-bottom: 12px;
  }

  /* ===== ポップアップ ===== */
  #popup {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: #111;
    color: #fff;
    padding: 10px 16px;
    border-radius: 6px;
    font-size: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s;
    z-index: 1000;
  }
  #popup.show {
    opacity: 1;
  }

  /* ===== カレンダー ===== */
  .calendar {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 6px;
    margin-bottom: 16px;
  }

  .day {
    min-width: 110px;
    background: #fff;
    border-radius: 8px;
    padding: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    flex-shrink: 0;
  }

  .day h2 {
    font-size: 14px;
    margin: 0 0 6px;
    text-align: center;
  }

  .participants {
    font-size: 13px;
    min-height: 40px;
  }

  .btn {
    width: 100%;
    margin-top: 6px;
    padding: 6px;
    font-size: 13px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
  }

  .join {
    background: #007aff;
    color: #fff;
  }

  .cancel {
    background: #ddd;
  }

  /* ===== 新規作成枠 ===== */
  .new-entry {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .new-entry input {
    flex: 1;
    padding: 8px;
    font-size: 14px;
  }

  .new-entry button {
    padding: 8px 12px;
    font-size: 14px;
  }

</style>
</head>

<body>

<h1>参加カレンダー</h1>

<div id="popup">更新しました</div>

<div class="calendar" id="calendar"></div>

<div class="new-entry">
  <input type="text" id="nameInput" placeholder="表示名を入力" />
  <button onclick="saveName()">保存</button>
</div>

<script>
/* ===== 設定 ===== */
const ANY_KEY = "あなたが送ってくれたANY_KEYをここに"; // ←ここだけ確認
const STORAGE_KEY = "booking-data-v2";
const NAME_KEY = "display-name";

/* ===== 日付固定 ===== */
const dates = [
  "12/29", "12/30", "12/31", "1/1", "1/2", "1/3", "1/4"
];

/* ===== 状態 ===== */
let data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
let displayName = localStorage.getItem(NAME_KEY) || "";

/* ===== 初期表示 ===== */
const calendar = document.getElementById("calendar");

function render() {
  calendar.innerHTML = "";

  dates.forEach(date => {
    if (!data[date]) data[date] = [];

    const div = document.createElement("div");
    div.className = "day";

    const joined = data[date].includes(displayName);

    div.innerHTML = `
      <h2>${date}</h2>
      <div class="participants">
        ${data[date].join("<br>")}
      </div>
      <button class="btn ${joined ? "cancel" : "join"}"
        onclick="${joined ? "cancelJoin" : "join"}('${date}')">
        ${joined ? "取消" : "参加"}
      </button>
    `;

    calendar.appendChild(div);
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

/* ===== 参加 ===== */
function join(date) {
  if (!displayName) {
    alert("表示名を先に保存してください");
    return;
  }

  // 即時反映（体感速度改善）
  data[date].push(displayName);
  render();
  showPopup("参加しました");
}

/* ===== 取消 ===== */
function cancelJoin(date) {
  data[date] = data[date].filter(n => n !== displayName);
  render();
  showPopup("取消しました");
}

/* ===== 表示名保存（過去分も連動修正） ===== */
function saveName() {
  const input = document.getElementById("nameInput").value.trim();
  if (!input) return;

  const oldName = displayName;
  displayName = input;

  if (oldName && oldName !== displayName) {
    Object.keys(data).forEach(date => {
      data[date] = data[date].map(n => n === oldName ? displayName : n);
    });
  }

  localStorage.setItem(NAME_KEY, displayName);
  render();
  showPopup("表示名を更新しました");
}

/* ===== ポップアップ ===== */
function showPopup(text) {
  const popup = document.getElementById("popup");
  popup.textContent = text;
  popup.classList.add("show");

  setTimeout(() => {
    popup.classList.remove("show");
  }, 2000);
}

/* ===== リロード後ポップアップ ===== */
window.addEventListener("load", () => {
  if (displayName) {
    setTimeout(() => {
      showPopup("読み込み完了");
    }, 2000);
  }
});

/* 初回描画 */
render();
</script>

</body>
</html>
